# user_settings.yaml — for use with oregon.db
#
# Launch the GMS app against the Oregon sample data:
#
#   env -i HOME=$HOME PATH=$PATH \
#     DATABASE_PATH=.../oregon_sample/oregon.db \
#     SETTINGS_PATH=.../oregon_sample/user_settings.yaml \
#     python -m sources.app.run --port 5002
#
# env -i strips inherited Bloomerang/Google credentials so any accidental
# Sync click against this sample DB finds no auth and cannot reach the real
# CRMs. Post-ADR-009 this becomes:
#
#   GMS_CONFIG_DIR=/tmp/gms-oregon-scratch \
#     DATABASE_PATH=.../oregon.db ...
#
# No document_roots yet — Stage 2+ will populate canonical orgs first;
# synthetic document filesystem is a later concern.

version: "1.0"

document_roots: []

discovery_preferences:
  max_depth: 10
  include_hidden: false
  excluded_directories:
    - "__pycache__"
    - ".git"
    - "node_modules"
    - ".DS_Store"
    - "Thumbs.db"
  document_extensions:
    - ".pdf"
    - ".docx"
    - ".doc"
    - ".xlsx"
    - ".txt"
    - ".rtf"
    - ".pptx"
  extraction_timeout_seconds: 120.0
  extraction_batch_size: 100
